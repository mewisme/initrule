# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: initrule

builds:
  - id: initrule
    main: .
    binary: initrule
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: initrule
    formats: [tar.gz]
    files:
      - LICENSE
      - README.md
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

# Attach initrule.json to the GitHub release via CI (see release.yml).
# scoops generates the file; skip_upload skips scoop-bucket push (scoop-mew syncs the release asset).
# https://goreleaser.com/customization/publish/scoop/
scoops:
  - name: initrule
    url_template: "https://github.com/mewisme/initrule/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    homepage: "https://github.com/mewisme/initrule"
    description: "CLI to install Cursor rule files (.cursor/rules/*.mdc) into a project"
    license: MIT
    goamd64: v1
    skip_upload: true
    repository:
      owner: mewisme
      name: scoop-mew
      branch: main

# Attach initrule.rb to the GitHub release via CI (see release.yml).
# homebrew_casks generates the file; skip_upload skips tap push (homebrew-tools syncs the release asset).
# https://goreleaser.com/customization/publish/homebrew_casks/
homebrew_casks:
  - name: initrule
    ids:
      - initrule
    binaries:
      - initrule
    homepage: "https://github.com/mewisme/initrule"
    description: "CLI to install Cursor rule files (.cursor/rules/*.mdc) into a project"
    directory: Casks
    skip_upload: true
    hooks:
      post:
        # Unsigned binary — clear quarantine so macOS Gatekeeper does not block it.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/initrule"]
          end
    repository:
      owner: mewisme
      name: homebrew-tools
      branch: main
