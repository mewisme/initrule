name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install UPX
        run: sudo apt-get update && sudo apt-get install -y upx-ucl

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # skip_upload: attach package manifests for scoop/homebrew sync.
      - name: Attach package manifests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -f dist/scoop/agentrule.json
          test -f dist/homebrew/Casks/agentrule.rb
          gh release upload "${GITHUB_REF_NAME}" \
            dist/scoop/agentrule.json \
            dist/homebrew/Casks/agentrule.rb \
            --clobber

      # Cross-repo: needs PAT with contents:write (or workflow) on homebrew-mew + scoop-mew.
      - name: Trigger package manager sync
        env:
          GH_TOKEN: ${{ secrets.PACKAGE_SYNC_TOKEN }}
        run: |
          payload=$(jq -n \
            --arg name "agentrule" \
            --arg tag "${GITHUB_REF_NAME}" \
            '{event_type:"sync-package",client_payload:{name:$name,tag:$tag}}')
          for repo in homebrew-mew scoop-mew; do
            echo "$payload" | gh api "repos/${{ github.repository_owner }}/${repo}/dispatches" --input -
            echo "Dispatched sync-package to ${{ github.repository_owner }}/${repo} (${GITHUB_REF_NAME})"
          done
