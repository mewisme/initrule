# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: agentrule

builds:
  - id: agentrule
    main: .
    binary: agentrule
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
      - "386"
      - arm
    goarm:
      - "7"
    ignore:
      # macOS dropped 32-bit long ago
      - goos: darwin
        goarch: "386"
      - goos: darwin
        goarch: arm
      # Windows 32-bit ARM is effectively unused
      - goos: windows
        goarch: arm

# https://goreleaser.com/customization/upx/
# darwin unsupported (Gatekeeper/Ventura+); skip if upx missing from PATH.
upx:
  - enabled: true
    ids: [agentrule]
    goos: [linux, windows]
    compress: best

archives:
  - id: agentrule
    formats: [tar.gz]
    files:
      - LICENSE
      - README.md
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ .Version }}-next"

changelog:
  use: github
  sort: asc
  abbrev: -1
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Performance
      regexp: '^.*?perf(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Refactor
      regexp: '^.*?refactor(\([[:word:]]+\))??!?:.+$'
      order: 3
    - title: Build
      regexp: '^.*?(build|ci)(\([[:word:]]+\))??!?:.+$'
      order: 4
    - title: Documentation
      regexp: '^.*?docs(\([[:word:]]+\))??!?:.+$'
      order: 5
    - title: Others
      order: 999
  filters:
    exclude:
      - "^test:"
      - "^chore:"
      - "^style:"
      - "^revert:"
      - "^Merge pull request"
      - "^Merge branch"

# Attach agentrule.json to the GitHub release via CI (see release.yml).
# scoops generates the file; skip_upload skips scoop-bucket push (scoop-mew syncs the release asset).
# https://goreleaser.com/customization/publish/scoop/
scoops:
  - name: agentrule
    url_template: "https://github.com/mewisme/agentrule/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    homepage: "https://github.com/mewisme/agentrule"
    description: "CLI to install agent instruction rules across Cursor, Claude, Codex, and more"
    license: MIT
    goamd64: v1
    skip_upload: true
    repository:
      owner: mewisme
      name: scoop-mew
      branch: main

# Attach agentrule.rb to the GitHub release via CI (see release.yml).
# homebrew_casks generates the file; skip_upload skips tap push (homebrew-tools syncs the release asset).
# https://goreleaser.com/customization/publish/homebrew_casks/
homebrew_casks:
  - name: agentrule
    ids:
      - agentrule
    binaries:
      - agentrule
    homepage: "https://github.com/mewisme/agentrule"
    description: "CLI to install agent instruction rules across Cursor, Claude, Codex, and more"
    directory: Casks
    skip_upload: true
    hooks:
      post:
        # Unsigned binary — clear quarantine so macOS Gatekeeper does not block it.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/agentrule"]
          end
    repository:
      owner: mewisme
      name: homebrew-tools
      branch: main
