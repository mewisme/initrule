name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install UPX
        run: sudo apt-get update && sudo apt-get install -y upx-ucl

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # skip_upload: attach package manifests for scoop/homebrew sync.
      - name: Attach package manifests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -f dist/scoop/initrule.json
          test -f dist/homebrew/Casks/initrule.rb
          gh release upload "${GITHUB_REF_NAME}" \
            dist/scoop/initrule.json \
            dist/homebrew/Casks/initrule.rb \
            --clobber
